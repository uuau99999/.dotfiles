# Private tmux server for the Herdr Yazi popup (tmux -L herdr-yazi -f this file).
# Do not source the user tmux.conf: that config's prefix bindings and status
# bar would show up inside Yazi.

set -g prefix C-q
unbind C-b
set -g status off
set -g mouse off
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g window-size latest
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# prefix+y hides the Herdr popup. detach-client drops only this client;
# Yazi and any editor it launched keep running for the next attach.
bind y detach-client
# Press the prefix twice to deliver ctrl+q to Yazi or nvim.
bind C-q send-prefix
