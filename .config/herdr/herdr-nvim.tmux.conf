# Private tmux server for the Herdr Neovim popup (tmux -L herdr-nvim -f this file).
# Do not source the user tmux.conf: that config's prefix bindings and status
# bar would show up inside Neovim.

set -g prefix C-q
unbind C-b
set -g status off
set -g mouse off
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g window-size latest
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# prefix+n hides the Herdr popup. detach-client drops only this client;
# this workspace's Neovim keeps running for the next attach.
bind n detach-client
# Press the prefix twice to deliver ctrl+q to Neovim.
bind C-q send-prefix
